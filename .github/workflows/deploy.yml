name: Deploy
# develop -> dev  (worker "lifey-dev", dev Supabase)
# main    -> prod (worker "lifey", prod Supabase); main still holds the old app until the v1.0.0 release
# Other branches only run checks (check.yml).
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    # Supabase refs, URLs and publishable keys are public (they ship in the app bundle), so they live here.
    # The only Supabase secret is SUPABASE_ACCESS_TOKEN.
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      SUPABASE_PROJECT_REF: ${{ github.ref_name == 'main' && 'klxhdsravxkprqxdgebv' || 'uezezkydnlbksrqvaipr' }}
      VITE_SUPABASE_URL: ${{ github.ref_name == 'main' && 'https://klxhdsravxkprqxdgebv.supabase.co' || 'https://uezezkydnlbksrqvaipr.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ github.ref_name == 'main' && 'sb_publishable_sACpYnhosiXr03kQQtwlfQ_5N36ziLp' || 'sb_publishable_ljBGmafJjhU7TtycIccS9g_t5_FInRI' }}
      HAS_SUPABASE: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # nothing reaches the database or Cloudflare unless every check passes
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - name: Apply database migrations
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/migrate.mjs "$SUPABASE_PROJECT_REF"
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.40.0'
          command: deploy ${{ env.TARGET == 'dev' && '--env dev' || '' }}
