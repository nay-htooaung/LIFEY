name: Deploy
# main -> production (worker "lifey", prod Supabase)
# any other branch -> dev (worker "lifey-dev", dev Supabase)
on:
  push:
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      HAS_SUPABASE: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          npx --yes supabase@2.50.0 link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@2.50.0 db push --password "$SUPABASE_DB_PASSWORD"
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Deploy to Cloudflare
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.40.0'
          command: deploy ${{ env.TARGET == 'dev' && '--env dev' || '' }}
